<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Baran Başaran{% endblock %}</title>
    <meta name="description" content="Baran Başaran - AI Engineer | LLM Deployment & Fine-tuning | Portfolio">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='img/avatar1.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/avatar1.png') }}">
    <!-- Open Graph / URL Preview -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Baran Başaran - Portfolio">
    <meta property="og:description" content="AI Engineer | LLM Deployment & Fine-tuning | Docker, Kubernetes, Python">
    <meta property="og:image" content="https://www.baranbasaran.com/static/img/avatar1.png">
    <meta property="og:url" content="https://www.baranbasaran.com">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:image" content="https://www.baranbasaran.com/static/img/avatar1.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar" id="navbar">
        <a href="/" class="nav-logo">
            <div class="logo-avatar-wrap" style="width:36px;height:36px;max-width:36px;max-height:36px;border-radius:50%;overflow:hidden;flex-shrink:0;">
                <img src="{{ url_for('static', filename='img/avatar.png') }}" alt="BB" class="logo-avatar" style="width:36px;height:36px;max-width:36px;max-height:36px;object-fit:cover;object-position:center 20%;display:block;border-radius:50%;">
            </div>
            <span class="logo-name">Baran Başaran</span>
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/#projects" class="nav-link">Projeler</a>
            <a href="/yt-downloader" class="nav-link">YT Downloader</a>
            <a href="/docker" class="nav-link">Docker</a>
            <a href="/wiki-speedrun" class="nav-link">Wiki Speedrun</a>
            <div class="nav-divider"></div>
            <a href="{{ info.github }}" target="_blank" class="nav-link nav-icon-link">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="{{ info.linkedin }}" target="_blank" class="nav-link nav-icon-link">
                <i class="fa-brands fa-linkedin"></i>
            </a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Menü">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-left">
                <div class="footer-terminal">
                    <span class="terminal-prompt">baran@debian</span><span class="terminal-separator">:</span><span class="terminal-path">~</span><span class="terminal-dollar">$</span>
                    <span class="terminal-cmd" id="footerCmd"></span><span class="terminal-cursor">▊</span>
                </div>
                <div class="footer-stack">
                    <span class="stack-item"><i class="fa-brands fa-python"></i> Python</span>
                    <span class="stack-dot">·</span>
                    <span class="stack-item"><i class="fa-brands fa-docker"></i> Docker</span>
                    <span class="stack-dot">·</span>
                    <span class="stack-item"><i class="fa-solid fa-server"></i> Debian 12</span>
                    <span class="stack-dot">·</span>
                    <span class="stack-item"><i class="fa-solid fa-lock"></i> Let's Encrypt</span>
                </div>
            </div>
            <div class="footer-right">
                <div class="footer-links">
                    <a href="{{ info.github }}" target="_blank" title="GitHub" class="footer-social">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="{{ info.linkedin }}" target="_blank" title="LinkedIn" class="footer-social">
                        <i class="fa-brands fa-linkedin"></i>
                    </a>
                    <a href="mailto:{{ info.email }}" title="Email" class="footer-social">
                        <i class="fa-solid fa-envelope"></i>
                    </a>
                </div>
                <p class="footer-copy">Self-hosted with <span class="footer-heart">♥</span> by Baran Başaran</p>
            </div>
        </div>
    </footer>

    <script>
        // Mobile nav toggle
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        if (navToggle) {
            navToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
                const icon = navToggle.querySelector('i');
                icon.classList.toggle('fa-bars');
                icon.classList.toggle('fa-xmark');
            });
        }
        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });
    </script>
    <script>
    // Footer terminal typing animation
    (function() {
        const commands = [
            'uptime',
            'echo "merhaba dünya"',
            'systemctl status sunucu',
            'neofetch',
            'cat /etc/os-release',
            'free -h',
            'curl https://baranbasaran.com'
        ];
        const el = document.getElementById('footerCmd');
        if (!el) return;
        let cmdIdx = 0;
        function typeCmd() {
            const cmd = commands[cmdIdx % commands.length];
            let i = 0;
            el.textContent = '';
            const interval = setInterval(() => {
                el.textContent = cmd.slice(0, ++i);
                if (i >= cmd.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        el.textContent = '';
                        cmdIdx++;
                        typeCmd();
                    }, 2500);
                }
            }, 70);
        }
        typeCmd();
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
