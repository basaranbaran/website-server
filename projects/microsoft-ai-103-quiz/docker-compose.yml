version: '3.8'

services:
  quiz-app:
    build: .
    container_name: examtopics-quiz-app
    ports:
      - "6321:6321"
    environment:
      - PORT=6321
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6321/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
