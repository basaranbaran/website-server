name: Monster Server Deploy

on:
  push:
    branches:
      - main  # Main branch'ine her push geldiğinde çalışır

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile Sunucuya Bağlan ve Kodu Çek
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/baran/sunucu
            
            # GitHub ile zorla eşitle (sunucudaki manuel değişiklikleri ezecek)
            git fetch origin main
            git reset --hard origin/main
            git clean -fd --exclude=venv/ --exclude=node_modules/ --exclude=.next/ --exclude=logs/ --exclude=__pycache__/
            
            # Flask'ı yeniden başlat
            sudo systemctl restart sunucu